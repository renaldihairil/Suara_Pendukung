<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f2447">
  <title>Offline — Suara Pendukung</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f2447,#1e4485);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;padding:24px}
    .card{max-width:360px;text-align:center}
    .ico{font-size:56px;margin-bottom:12px}
    h1{font-size:20px;margin:0 0 8px}
    p{font-size:14px;line-height:1.6;opacity:.85;margin:0 0 20px}
    button{background:#fff;color:#2563eb;border:none;border-radius:12px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <div class="ico">📡</div>
    <h1>Tidak Ada Koneksi</h1>
    <p>App shell sudah terpasang, tapi data butuh koneksi internet.<br>Periksa jaringan Anda lalu coba lagi.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
