# Pemicu pengingat harian (hitung mundur Hari H & agenda) secara berkala.
# Vercel Cron (paket Hobby) hanya bisa 1x sehari dan waktunya tidak presisi;
# workflow ini memanggil /api/cron tiap 30 menit supaya jam pengingat yang
# diatur admin tepat waktu. Aman dipanggil berulang (anti-dobel di server).
#
# Setup sekali: GitHub → Settings → Secrets and variables → Actions
#   APP_URL      = https://suara-pendukung.vercel.app   (tanpa garis miring di akhir)
#   CRON_SECRET  = nilai yang sama dengan env CRON_SECRET di Vercel
name: Pengingat Harian
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil /api/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET belum diisi — lewati"; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
